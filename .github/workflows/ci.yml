name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: vacancy_scout
          POSTGRES_PASSWORD: vacancy_scout
          POSTGRES_DB: vacancy_scout
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/**.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Lint backend (Spotless)
        run: ./gradlew :backend:spotlessCheck
      
      - name: Lint backend (Checkstyle)
        run: ./gradlew :backend:checkstyleMain
      
      - name: Lint backend (PMD)
        run: ./gradlew :backend:pmdMain
      
      - name: Build backend
        run: ./gradlew :backend:build -x spotlessCheck -x checkstyleMain -x pmdMain
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend (Vite)
        working-directory: ./frontend
        run: npm run build
      
      - name: Lint frontend (ESLint)
        working-directory: ./frontend
        run: npm run lint
      
      - name: Lint frontend (Prettier)
        working-directory: ./frontend
        run: npm run format
      
      - name: Run tests (backend)
        run: ./gradlew :backend:test
      
      - name: Liquibase migrations (validate changelogs)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: vacancy_scout
          POSTGRES_PASSWORD: vacancy_scout
          POSTGRES_DB: vacancy_scout
        run: |
          # Wait for PostgreSQL to be ready (using bash TCP connection)
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          # Run Liquibase validate using the liquibase jar from gradle cache with absolute path
          LIQUIBASE_JAR=$(find ~/.gradle/caches -name "liquibase-core-4.27.0.jar" | head -1)
          if [ -z "$LIQUIBASE_JAR" ]; then
            echo "Liquibase 4.27.0 jar not found in gradle cache, trying any version..."
            LIQUIBASE_JAR=$(find ~/.gradle/caches -name "liquibase-core-*.jar" | head -1)
          fi
          if [ -z "$LIQUIBASE_JAR" ]; then
            echo "ERROR: Liquibase jar not found in gradle cache"
            exit 1
          fi
          PG_JAR=$(find ~/.gradle/caches -name "postgresql-*.jar" | grep -v sources | head -1)
          if [ -z "$PG_JAR" ]; then
            echo "ERROR: PostgreSQL driver jar not found in gradle cache"
            exit 1
          fi
          PICOCli_JAR=$(find ~/.gradle/caches -name "picocli-*.jar" | head -1)
          if [ -z "$PICOCli_JAR" ]; then
            echo "ERROR: Picocli jar not found in gradle cache"
            exit 1
          fi
          CHANGelog_PATH=$(pwd)/backend/src/main/resources/db/changelog/db.changelog-master.xml
          echo "Running Liquibase validate..."
          echo "  Changelog: $CHANGelog_PATH"
          echo "  Liquibase jar: $LIQUIBASE_JAR"
          java -cp "$LIQUIBASE_JAR:$PG_JAR:$PICOCli_JAR" \
            liquibase.Liquibase \
            --changelog-file="$CHANGelog_PATH" \
            --url=jdbc:postgresql://localhost:5432/vacancy_scout \
            --username=vacancy_scout \
            --password=vacancy_scout \
            validate
      
      - name: Generate Jacoco report
        run: ./gradlew :backend:jacocoTestReport
